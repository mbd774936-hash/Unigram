name: build-unigram
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch tgcalls jitter buffer min delay to 0
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path Libraries/tgcalls -Recurse -Filter GroupInstanceCustomImpl.cpp | Select-Object -First 1
          if (-not $f) { throw "GroupInstanceCustomImpl.cpp not found" }
          Write-Host "File: $($f.FullName)"
          Select-String -Path $f.FullName -Pattern "audio_jitter_buffer" | ForEach-Object { Write-Host "BEFORE: $($_.Line.Trim())" }
          $c = Get-Content $f.FullName -Raw
          $n = $c -replace 'audio_jitter_buffer_min_delay_ms\s*=\s*\d+', 'audio_jitter_buffer_min_delay_ms = 0'
          if ($n -eq $c) { throw "Pattern audio_jitter_buffer_min_delay_ms not found or already 0" }
          Set-Content -Path $f.FullName -Value $n -NoNewline
          Select-String -Path $f.FullName -Pattern "audio_jitter_buffer" | ForEach-Object { Write-Host "AFTER: $($_.Line.Trim())" }

      - name: Write Constants.Secret.cs
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          $code = @"
          namespace Telegram
          {
              public static partial class Constants
              {
                  static Constants()
                  {
                      ApiId = $env:TG_API_ID;
                      ApiHash = "$env:TG_API_HASH";
                      AppChannel = "unigram";
                  }
              }
          }
          "@
          Set-Content -Path Telegram/Constants.Secret.cs -Value $code -Encoding UTF8

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: latest

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Get vcpkg
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "vcpkg"
          git clone https://github.com/Microsoft/vcpkg.git $dest
          & "$dest\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore TDLib cache
        id: tdcache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries/tdjson/x64
            vcpkg_installed
          key: tdlib-x64-v1-${{ hashFiles('vcpkg.json', 'Libraries/tdjson/build.ps1') }}

      - name: Install gperf
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          choco install gperf -y --no-progress
          $g = Get-Command gperf -ErrorAction SilentlyContinue
          if (-not $g) {
            & "$env:VCPKG_ROOT\vcpkg.exe" install gperf:x64-windows
            $dir = Get-ChildItem -Path "$env:VCPKG_ROOT\installed\x64-windows\tools" -Recurse -Filter gperf.exe | Select-Object -First 1 -ExpandProperty DirectoryName
            $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: Libraries/tdjson
        run: powershell -ExecutionPolicy ByPass ./build.ps1 -arch x64

      - name: Save TDLib cache
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries/tdjson/x64
            vcpkg_installed
          key: tdlib-x64-v1-${{ hashFiles('vcpkg.json', 'Libraries/tdjson/build.ps1') }}

      - name: Place td_api.tl and build stub DLL
        shell: pwsh
        run: |
          $sum = $env:GITHUB_STEP_SUMMARY
          $tl = Get-ChildItem -Path Libraries -Recurse -Filter td_api.tl -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\(x64|ARM64)\\' } | Select-Object -First 1
          if (-not $tl) { throw "td_api.tl not found anywhere under Libraries" }
          foreach ($d in 'Libraries/tdjson/x64','Libraries/tdjson') {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Copy-Item $tl.FullName (Join-Path $d 'td_api.tl') -Force
          }
          $stubDir = Join-Path $env:RUNNER_TEMP 'stubdll'
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null
          Set-Content -Path (Join-Path $stubDir 'stub.c') -Value '#include <windows.h>
          __declspec(dllexport) int stub_dummy(void) { return 0; }
          BOOL WINAPI DllMain(HINSTANCE h, DWORD r, LPVOID p) { return TRUE; }'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && cd /d `"$stubDir`" && cl /nologo /LD /MT stub.c /Fe:stub.dll" | Out-Host
          $stub = Join-Path $stubDir 'stub.dll'
          $ok = Test-Path $stub
          if ($ok) { "STUBDLL=$stub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          New-Item -ItemType Directory -Force -Path Libraries/wallet-engine/x64 | Out-Null
          foreach ($n in 'wallet_engine.dll','wallet_engine.pdb') {
            $p = Join-Path $PWD.Path "Libraries/wallet-engine/x64/$n"
            if ($n -like '*.dll' -and $ok) { Copy-Item $stub $p -Force }
            elseif (-not (Test-Path $p)) { [System.IO.File]::WriteAllBytes($p, [byte[]](0)) }
          }
          "## Diagnostics" | Out-File $sum -Append
          '```' | Out-File $sum -Append
          "td_api.tl source: $($tl.FullName.Replace($PWD.Path,''))" | Out-File $sum -Append
          "valid stub dll built: $ok" | Out-File $sum -Append
          if ($ok) { "stub size: $((Get-Item $stub).Length)" | Out-File $sum -Append }
          '```' | Out-File $sum -Append

      - name: Restore NuGet packages (msbuild)
        shell: pwsh
        run: msbuild Telegram.slnx /t:Restore /p:RestorePackagesConfig=true /p:Configuration=Release /p:Platform=x64

      - name: Restore NuGet packages (nuget.exe fallback)
        continue-on-error: true
        shell: pwsh
        run: nuget restore Telegram.slnx

      - name: Build Unigram (staged fallbacks)
        shell: pwsh
        run: |
          function Run-Msbuild([string]$log, [string[]]$extra) {
            .\UpdateManifest.ps1 -path "Telegram.Msix\\" -config "RELEASE" -mode "SideloadOnly" | Out-Host
            $margs = @('Telegram.slnx','/target:Telegram_Msix','/p:Configuration=Release','/p:Platform=x64','/p:UapAppxPackageBuildMode=SideloadOnly','/p:AppxBundlePlatforms=x64','/p:AppxBundle=Always','/p:AppxPackageSigningEnabled=True') + $extra
            msbuild @margs *>&1 | Tee-Object -FilePath $log | Out-Host
            return $LASTEXITCODE
          }

          function Build-WithStubs([string]$tag, [string[]]$extra) {
            $code = 1
            for ($i = 1; $i -le 4; $i++) {
              $log = "build_${tag}_$i.log"
              $global:lastLog = $log
              Write-Host "=== stage $tag attempt $i ==="
              $code = Run-Msbuild $log $extra
              if ($code -eq 0) { return 0 }
              $missing = Select-String -Path $log -Pattern 'error MSB3030: Could not copy the file "([^"]+)" because it was not found' -AllMatches | ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
              if (-not $missing) { return $code }
              foreach ($m in $missing) {
                if ([System.IO.Path]::IsPathRooted($m)) { $p = $m } else { $p = Join-Path $PWD.Path $m }
                $p = [System.IO.Path]::GetFullPath($p)
                Write-Host "STUB: $p"
                New-Item -ItemType Directory -Force -Path (Split-Path $p -Parent) | Out-Null
                if ($p -like '*.dll' -and $env:STUBDLL -and (Test-Path $env:STUBDLL)) { Copy-Item $env:STUBDLL $p -Force } else { [System.IO.File]::WriteAllBytes($p, [byte[]](0)) }
              }
            }
            return $code
          }

          $code = Build-WithStubs 'a' @()
          if ($code -ne 0 -and (Select-String -Path $global:lastLog -Pattern 'Internal compiler error' -Quiet)) {
            Write-Host "=== STAGE B: invalid-bytes wallet dll ==="
            $env:STUBDLL = ''
            Get-ChildItem Libraries/wallet-engine/x64 -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object { [System.IO.File]::WriteAllBytes($_.FullName, [byte[]](0)) }
            $code = Build-WithStubs 'b' @()
          }
          if ($code -ne 0 -and (Select-String -Path $global:lastLog -Pattern 'Internal compiler error' -Quiet)) {
            Write-Host "=== STAGE C: without .NET Native ==="
            $code = Build-WithStubs 'c' @('/p:UseDotNetNativeToolchain=false')
          }
          Copy-Item $global:lastLog build.log -Force
          Write-Host "FINAL: exit code $code, last log $global:lastLog"
          exit $code

      - name: Show build errors
        if: always()
        shell: pwsh
        run: |
          $sum = $env:GITHUB_STEP_SUMMARY
          "## Stages run" | Out-File $sum -Append
          '```' | Out-File $sum -Append
          (Get-ChildItem build_*.log -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ' | Out-File $sum -Append
          '```' | Out-File $sum -Append
          if (-not (Test-Path build.log)) { "no build.log" | Out-File $sum -Append; exit 0 }
          $errs = Select-String -Path build.log -CaseSensitive -Pattern ': error |error [A-Z]+[0-9]+:|fatal error|error LNK|error :|Build FAILED' | Select-Object -First 12 | ForEach-Object { $t = $_.Line.Trim() -replace 'D:\\a\\Unigram\\Unigram\\','' -replace '\s*\[[^\]]*\]$',''; if ($t.Length -gt 400) { $t.Substring(0,400) } else { $t } }
          "## Build errors (first 12)" | Out-File $sum -Append
          '```' | Out-File $sum -Append
          $errs | Out-File $sum -Append
          '```' | Out-File $sum -Append

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unigram-build
          path: |
            Telegram.Msix/AppPackages/**
            **/*.msixbundle
            build.log
          if-no-files-found: warn
