name: build-unigram
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch tgcalls jitter buffer min delay to 0
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path Libraries/tgcalls -Recurse -Filter GroupInstanceCustomImpl.cpp | Select-Object -First 1
          if (-not $f) { throw "GroupInstanceCustomImpl.cpp not found" }
          Write-Host "File: $($f.FullName)"
          Select-String -Path $f.FullName -Pattern "audio_jitter_buffer" | ForEach-Object { Write-Host "BEFORE: $($_.Line.Trim())" }
          $c = Get-Content $f.FullName -Raw
          $n = $c -replace 'audio_jitter_buffer_min_delay_ms\s*=\s*\d+', 'audio_jitter_buffer_min_delay_ms = 0'
          if ($n -eq $c) { throw "Pattern audio_jitter_buffer_min_delay_ms not found or already 0" }
          Set-Content -Path $f.FullName -Value $n -NoNewline
          Select-String -Path $f.FullName -Pattern "audio_jitter_buffer" | ForEach-Object { Write-Host "AFTER: $($_.Line.Trim())" }

      - name: Write Constants.Secret.cs
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          $code = @"
          namespace Telegram
          {
              public static partial class Constants
              {
                  static Constants()
                  {
                      ApiId = $env:TG_API_ID;
                      ApiHash = "$env:TG_API_HASH";
                      AppChannel = "unigram";
                  }
              }
          }
          "@
          Set-Content -Path Telegram/Constants.Secret.cs -Value $code -Encoding UTF8

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: latest

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Get vcpkg
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "vcpkg"
          git clone https://github.com/Microsoft/vcpkg.git $dest
          & "$dest\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore TDLib cache
        id: tdcache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries/tdjson/x64
            vcpkg_installed
          key: tdlib-x64-v1-${{ hashFiles('vcpkg.json', 'Libraries/tdjson/build.ps1') }}

      - name: Install gperf
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          choco install gperf -y --no-progress
          $g = Get-Command gperf -ErrorAction SilentlyContinue
          if (-not $g) {
            & "$env:VCPKG_ROOT\vcpkg.exe" install gperf:x64-windows
            $dir = Get-ChildItem -Path "$env:VCPKG_ROOT\installed\x64-windows\tools" -Recurse -Filter gperf.exe | Select-Object -First 1 -ExpandProperty DirectoryName
            $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: Libraries/tdjson
        run: powershell -ExecutionPolicy ByPass ./build.ps1 -arch x64

      - name: Save TDLib cache
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries/tdjson/x64
            vcpkg_installed
          key: tdlib-x64-v1-${{ hashFiles('vcpkg.json', 'Libraries/tdjson/build.ps1') }}

      - name: Place td_api.tl and diagnose
        shell: pwsh
        run: |
          $sum = $env:GITHUB_STEP_SUMMARY
          $tl = Get-ChildItem -Path Libraries -Recurse -Filter td_api.tl -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\(x64|ARM64)\\' } | Select-Object -First 1
          if (-not $tl) { throw "td_api.tl not found anywhere under Libraries" }
          foreach ($d in 'Libraries/tdjson/x64','Libraries/tdjson') {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Copy-Item $tl.FullName (Join-Path $d 'td_api.tl') -Force
          }
          "## Diagnostics" | Out-File $sum -Append
          '```' | Out-File $sum -Append
          "td_api.tl source: $($tl.FullName.Replace($PWD.Path,''))" | Out-File $sum -Append
          "--- csproj lines ---" | Out-File $sum -Append
          Select-String -Path Telegram/Telegram.csproj -Pattern 'td_api|Generators|AdditionalFiles|Analyzer|TdApi|tdjson' | Select-Object -First 25 | ForEach-Object { $t = $_.Line.Trim(); if ($t.Length -gt 200) { $t = $t.Substring(0,200) }; "$($_.LineNumber): $t" } | Out-File $sum -Append
          "--- Telegram.Generators files ---" | Out-File $sum -Append
          if (Test-Path Telegram.Generators) { Get-ChildItem Telegram.Generators -Recurse -File | Where-Object { $_.FullName -notmatch '\\(obj|bin)\\' } | Select-Object -First 20 | ForEach-Object { $_.FullName.Replace($PWD.Path,'') } | Out-File $sum -Append } else { "folder missing" | Out-File $sum -Append }
          '```' | Out-File $sum -Append

      - name: Restore NuGet packages (msbuild)
        shell: pwsh
        run: msbuild Telegram.slnx /t:Restore /p:RestorePackagesConfig=true /p:Configuration=Release /p:Platform=x64

      - name: Restore NuGet packages (nuget.exe fallback)
        continue-on-error: true
        shell: pwsh
        run: nuget restore Telegram.slnx

      - name: Build Unigram
        shell: pwsh
        run: |
          ./Build.ps1 -arch x64 *>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Show build errors
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { "no build.log" | Out-File $env:GITHUB_STEP_SUMMARY -Append; exit 0 }
          $errs = Select-String -Path build.log -CaseSensitive -Pattern ': error |error [A-Z]+[0-9]+:|fatal error|error LNK|error :|Build FAILED' | Select-Object -First 12 | ForEach-Object { $t = $_.Line.Trim() -replace 'D:\\a\\Unigram\\Unigram\\','' -replace '\s*\[[^\]]*\]$',''; if ($t.Length -gt 220) { $t.Substring(0,220) } else { $t } }
          "## Build errors (first 12)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $errs | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $miss = Select-String -Path build.log -Pattern 'CS2001' | Select-Object -First 8 | ForEach-Object { if ($_.Line -match "Source file '([^']+)'") { $Matches[1] -replace 'D:\\a\\Unigram\\Unigram\\','' } else { $_.Line.Trim() } }
          "## Missing source files (CS2001)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $miss | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unigram-build
          path: |
            Telegram.Msix/AppPackages/**
            **/*.msixbundle
            build.log
          if-no-files-found: warn
